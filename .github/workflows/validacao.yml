name: Validação Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# cancela execuções da mesma branch e mantém a mais recente
concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: testes, lint e build
    runs-on: ubuntu-latest

    steps:
      - name: baixar o código
        uses: actions/checkout@v4

      - name: configurar jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: configurar sdk
        uses: android-actions/setup-android@v3

      - name: instalar sdk 36
        run: sdkmanager "platform-tools" "platforms;android-36"

      - name: permitir execução do gradle
        run: chmod +x ./gradlew

      - name: configurar firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "O secret GOOGLE_SERVICES_JSON não foi configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: executar testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Executar android lint
        run: ./gradlew lintDebug

      - name: gerar apk de debug
        run: ./gradlew assembleDebug

      - name: Publicar apk da validação
        uses: actions/upload-artifact@v4
        with:
          name: acta-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
